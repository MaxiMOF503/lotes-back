spring.application.name=lotes

# Base esperada: verificador_lotes (MySQL 8+)
# Ejemplo de DB_URL: jdbc:mysql://localhost:3306/verificador_lotes?useSSL=false&serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Cargar los lotes de demostración al iniciar, después de actualizar el esquema JPA.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Cuentas de clase opcionales; las contraseñas se proporcionan solo por entorno.
demo.accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
