spring.application.name=lotes

# Base esperada: verificador_lotes (MySQL 8+)
# Ejemplo de DB_URL: jdbc:mysql://localhost:3306/verificador_lotes?useSSL=false&serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway es el unico responsable del esquema (src/main/resources/db/migration).
# Hibernate solo verifica que las entidades coincidan con las tablas: nunca las modifica.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
# Base que ya tenia las tablas y todavia no usaba Flyway: se marca como version 0 y se aplican
# V1 y V2, que son idempotentes (no recrean tablas ni tocan filas). Una base vacia las crea.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true

# Datos demostrativos opcionales: DEMO_SQL_INIT_MODE=always para la clase.
# No agregar spring.jpa.defer-datasource-initialization=true: hace que Flyway espere a Hibernate y
# Hibernate validaria una base todavia vacia. data.sql corre despues de Flyway, que ya creo las tablas.
spring.sql.init.mode=${DEMO_SQL_INIT_MODE:never}
spring.sql.init.encoding=UTF-8

# Cuentas de clase opcionales; las contraseñas se proporcionan solo por entorno.
demo.accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}

# No insertar lotes ficticios por defecto. Los roles siguen disponibles.
demo.lotes.enabled=${DEMO_LOTES_ENABLED:false}

# Servicio oficial de normalización de direcciones (Gobierno nacional). Sin clave; se puede cambiar por entorno.
georef.url=${GEOREF_URL:https://apis.datos.gob.ar/georef/api}
